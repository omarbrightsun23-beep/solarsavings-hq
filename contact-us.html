<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — SolarSavingsHQ</title>
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://solarsavingshq.com/contact-us.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800 bg-slate-900/90 py-4 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-white">SolarSavings<span class="text-amber-400">HQ</span></a>
            <a href="/" class="text-xs text-amber-400 hover:underline">← Back to Calculator</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto py-12 px-6 flex-1">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-white">Get in Touch</h1>
            <p class="text-sm text-slate-400 mt-2">Questions about our solar financial models or calculation methodologies? Send us a message.</p>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-xl">
            <form onsubmit="handleContact(event)" class="space-y-5">
                <div>
                    <label for="contact-name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" id="contact-name" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label for="contact-email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="contact-email" required placeholder="john@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label for="contact-msg" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Message</label>
                    <textarea id="contact-msg" rows="4" required placeholder="How can we assist you with solar calculations?" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <button type="submit" id="btn-submit" class="w-full py-3.5 px-6 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-amber-500/10">
                    Send Inquiry
                </button>
            </form>

            <div id="contact-success" class="hidden mt-6 p-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs text-center font-medium">
                Thank you! Your message has been received. Our team will get back to you shortly.
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-950 py-8 px-6 text-center text-xs text-slate-500">
        &copy; 2026 SolarSavingsHQ. All rights reserved.
    </footer>

    <script>
        function handleContact(e) {
            e.preventDefault();
            document.getElementById('btn-submit').innerText = 'Sending...';
            setTimeout(() => {
                document.getElementById('btn-submit').classList.add('hidden');
                document.getElementById('contact-success').classList.remove('hidden');
            }, 600);
        }
    </script>
</body>
</html>
